[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eveng2-g2"
version = "1.0.0"
description = "From-scratch Python library for Even Realities G2 smart glasses over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eveng2" }]
keywords = ["even-realities", "g2", "smart-glasses", "bluetooth", "ble"]
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]