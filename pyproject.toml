[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "even-g2-protocol"
version = "0.1.0"
description = "Python library and protocol reference for Even Realities G2 smart glasses dashboard control and data streaming."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ithinkthisiscool" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "bleak>=0.21.0",
    "dbus-fast>=2.0.0",
    "aiohttp>=3.9.0",
    "lc3py>=1.1.0",
    "anthropic>=0.19.0",
]

[tool.setuptools]
# Tells setuptools to look for individual files in the root instead of a subfolder directory
py-modules = [
    "ble",
    "dashboard",
    "device",
    "even_ai",
    "evenhub",
    "file_service",
    "health",
    "menu",
    "navigation",
    "quicklist",
    "session",
    "settings",
    "sids",
    "stocks",
    "teleprompter",
    "translate",
    "transport",
    "watchface"
]
